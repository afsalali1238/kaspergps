name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push to a PR branch supersedes the run before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    # The suite generates telemetry day-by-day in a few files; it normally takes
    # about a minute and a half, so this only cuts off a hung job.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci`, not `npm install`: a clean install is itself a P1 check here.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Coverage (85% line floor)
        run: npm run test:coverage

  e2e:
    name: Playwright — shard ${{ matrix.shard }}/3 (desktop + phone)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium and its system libraries
        run: npx playwright install --with-deps chromium

      # The suite drives the app through its own webServer (a production build on
      # CI — see playwright.config.ts), desktop + phone projects.
      # Each shard takes a third of the tests across both projects. Playwright's
      # shard split is deterministic, so every test runs in exactly one shard.
      - name: E2E (shard ${{ matrix.shard }} of 3)
        run: npx playwright test --shard=${{ matrix.shard }}/3

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Agent D: visual regression (tests/e2e/visual.spec.ts), report-only until
  # agent J records the baselines and makes it a required check. Missing
  # baselines are written, not failed, and uploaded: J can take the runner's
  # Linux captures as the first baselines. A diff against a committed baseline
  # is reported in the step log and the artifact but doesn't fail the job yet.
  visual:
    name: Visual regression (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium and its system libraries
        run: npx playwright install --with-deps chromium

      - name: Visual regression (VISUAL=1, desktop project sets both widths)
        continue-on-error: true
        env:
          VISUAL: '1'
        run: npx playwright test visual --project=desktop --update-snapshots=missing

      - name: Upload screenshots and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression
          path: |
            tests/e2e/__screenshots__/
            playwright-report/
            test-results/
          retention-days: 14
